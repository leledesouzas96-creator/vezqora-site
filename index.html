<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEZQORA | Tecnologia, Sites, Apps e Agentes de IA</title>
  <meta name="description" content="Sites de alta conversão, aplicativos, sistemas sob medida e Agentes de IA que atendem e vendem 24h no piloto automático." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #060913;
      --bg-card: #0c1222;
      --bg-card-2: #10182c;
      --border: rgba(212, 175, 55, 0.22);
      --border-soft: rgba(255, 255, 255, 0.08);
      --gold: #e5b94c;
      --gold-2: #c9972c;
      --gold-glow: rgba(229, 185, 76, 0.25);
      --text-main: #f5f7fb;
      --text-muted: #9aa6be;
      --green: #16a34a;
      --green-bright: #22c55e;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(229, 185, 76, 0.09), transparent 36%),
        radial-gradient(circle at 85% 25%, rgba(56, 189, 248, 0.06), transparent 40%),
        var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container { width: min(1140px, 92%); margin: 0 auto; }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(6, 9, 19, 0.86);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-soft);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #090d16;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 20px var(--gold-glow);
    }
    .brand-text strong {
      display: block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }
    .brand-text span {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      font-weight: 600;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #090d16;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px var(--gold-glow);
      transition: transform 0.2s, filter 0.2s;
    }
    .btn-gold:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-outline:hover { border-color: var(--gold); background: rgba(229, 185, 76, 0.08); }

    /* HERO */
    .hero {
      padding: 58px 0 42px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(229, 185, 76, 0.1);
      border: 1px solid var(--border);
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-bright);
      box-shadow: 0 0 10px var(--green-bright);
    }
    .hero h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(2rem, 5vw, 3.35rem);
      font-weight: 800;
      line-height: 1.13;
      max-width: 840px;
      margin: 0 auto 18px;
    }
    .hero h1 span {
      background: linear-gradient(135deg, #fbe29c, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: var(--text-muted);
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      max-width: 670px;
      margin: 0 auto 28px;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 780px;
      margin: 0 auto;
      background: rgba(12, 18, 34, 0.75);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 18px;
    }
    .stat strong {
      display: block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.45rem;
      color: var(--gold);
    }
    .stat span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* SECTIONS */
    section { padding: 56px 0; }
    .section-head {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 38px;
    }
    .section-tag {
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    .section-head h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.65rem, 3.6vw, 2.35rem);
      margin-bottom: 10px;
    }
    .section-head p { color: var(--text-muted); font-size: 0.96rem; }

    /* SOLUCOES */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: linear-gradient(180deg, var(--bg-card), #090e1c);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 26px;
      transition: transform 0.25s, border-color 0.25s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--border); }
    .card-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(229, 185, 76, 0.12);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      margin-bottom: 16px;
    }
    .card h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; }
    .card ul { list-style: none; display: grid; gap: 8px; font-size: 0.86rem; color: #cbd5e1; }
    .card ul li::before { content: "✓ "; color: var(--gold); font-weight: 700; }

    /* PROJETOS REALISTAS (MOCKUPS 3D) */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 26px;
    }
    .project-card {
      background: linear-gradient(180deg, #0e1629, #080d19);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      transition: transform 0.28s, box-shadow 0.28s;
    }
    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 52px rgba(229, 185, 76, 0.12);
    }
    .mockup-stage {
      background: radial-gradient(circle at 50% 35%, rgba(229, 185, 76, 0.16), rgba(6, 9, 19, 0.95) 75%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 360px;
      position: relative;
      overflow: hidden;
    }
    .live-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      background: rgba(6, 9, 19, 0.85);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #86efac;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    /* Moldura realista de iPhone */
    .phone-frame {
      width: 215px;
      height: 330px;
      background: #05070d;
      border-radius: 32px;
      padding: 9px;
      border: 2px solid #2b354d;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.75),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      position: relative;
      transition: transform 0.35s ease;
    }
    .project-card:hover .phone-frame { transform: scale(1.03); }
    .phone-notch {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 15px;
      background: #05070d;
      border-radius: 999px;
      z-index: 3;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 23px;
      overflow: hidden;
      background: #111827;
      position: relative;
    }
    /* Recorte inteligente da captura real do salao para esconder barras do Android */
    .phone-screen img.real-shot {
      width: 100%;
      height: 118%;
      object-fit: cover;
      object-position: center 11%;
      display: block;
    }
    /* Mockup realista da tela do Agente de IA + WhatsApp */
    .sim-wa {
      height: 100%;
      background: #0b141a;
      display: flex;
      flex-direction: column;
      font-size: 0.66rem;
      color: #e9edef;
      padding-top: 22px;
    }
    .sim-wa-top {
      background: #1f2c34;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .sim-wa-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #090d16;
      font-weight: 800;
      display: grid;
      place-items: center;
      font-size: 0.65rem;
    }
    .sim-wa-body {
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
    }
    .bubble-in {
      background: #1f2c34;
      padding: 7px 9px;
      border-radius: 10px 10px 10px 2px;
      max-width: 88%;
      line-height: 1.35;
    }
    .bubble-out {
      background: #005c4b;
      padding: 7px 9px;
      border-radius: 10px 10px 2px 10px;
      max-width: 84%;
      align-self: flex-end;
      line-height: 1.35;
    }
    .bubble-lead {
      background: rgba(229, 185, 76, 0.14);
      border: 1px solid rgba(229, 185, 76, 0.4);
      color: #fde68a;
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 0.62rem;
      line-height: 1.35;
    }
    /* Mockup realista de Painel / E-commerce */
    .sim-dash {
      height: 100%;
      background: linear-gradient(180deg, #0f172a, #090d16);
      padding: 26px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.65rem;
    }
    .dash-kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .dash-kpi {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(229, 185, 76, 0.25);
      border-radius: 10px;
      padding: 8px;
    }
    .dash-kpi strong { display: block; color: var(--gold); font-size: 0.85rem; }
    .dash-kpi span { color: var(--text-muted); font-size: 0.58rem; }
    .dash-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 8px;
    }
    .dash-bar-wrap {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 68px;
      margin-top: 8px;
    }
    .dash-bar {
      flex: 1;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, var(--gold), rgba(229, 185, 76, 0.25));
    }
    .project-meta .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(229, 185, 76, 0.12);
      color: var(--gold);
      border: 1px solid rgba(229, 185, 76, 0.25);
    }
    .project-meta h3 { font-size: 1.18rem; margin-bottom: 6px; }
    .project-meta p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 16px; }
    .project-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* CONSULTOR IA WIDGET */
    .ia-box {
      max-width: 760px;
      margin: 0 auto;
      background: linear-gradient(180deg, #0d1426, #080d19);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .ia-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 14px;
    }
    .ia-title { display: flex; align-items: center; gap: 10px; }
    .ia-badge-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #090d16;
      font-weight: 800;
      display: grid;
