<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A14">
<meta name="description" content="VEZQORA — Tecnologia, Sites Profissionais, Aplicativos, Agentes de Inteligência Artificial e Automações no WhatsApp para Empresas.">
<title>VEZQORA | Tecnologia, IA & Automações para Empresas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090912;
  --card:#121223;
  --card-2:#17172c;
  --primary:#7C3AED;
  --primary-light:#A855F7;
  --accent:#06B6D4;
  --gold:#F59E0B;
  --text:#F8FAFC;
  --muted:#94A3B8;
  --line:rgba(148,163,184,.16);
  --shadow:0 20px 55px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(124,58,237,.18),transparent 40%),radial-gradient(circle at 10% 30%,rgba(6,182,212,.12),transparent 35%),var(--bg);color:var(--text);font-family:"Inter",sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.container{width:min(1160px,92%);margin:auto}

/* HEADER */
header{position:sticky;top:0;z-index:30;background:rgba(9,9,18,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-family:"Space Grotesk",sans-serif;font-size:24px;font-weight:700;letter-spacing:2px}
.brand-badge{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.4)}
.brand small{display:block;font:600 9px "Inter";letter-spacing:3px;color:var(--accent)}
.navlinks{display:flex;align-items:center;gap:26px;font-size:13px;font-weight:600;color:var(--muted)}
.navlinks a:hover{color:#fff}
.menu{display:none;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:10px;padding:8px 12px;font-size:20px;cursor:pointer}

.btn{border:0;border-radius:999px;padding:14px 24px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 30px rgba(124,58,237,.35);transition:transform .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(124,58,237,.5)}
.btn-outline{background:rgba(255,255,255,.04);border:1px solid var(--line);box-shadow:none}
.btn-outline:hover{border-color:var(--accent);background:rgba(6,182,212,.08)}

/* HERO */
.hero{padding:76px 0 64px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;background:rgba(124,58,237,.16);border:1px solid rgba(168,85,247,.35);color:#E9D5FF;font-size:12px;font-weight:600;letter-spacing:1px}
.hero h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(36px,5.6vw,64px);line-height:1.1;margin:22px auto 18px;max-width:860px;background:linear-gradient(180deg,#FFFFFF 30%,#CBD5E1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:clamp(16px,2vw,19px);max-width:670px;margin:0 auto 32px}
.hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:820px;margin:54px auto 0}
.metric-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.metric-box strong{display:block;font-family:"Space Grotesk",sans-serif;font-size:28px;color:var(--accent)}
.metric-box span{font-size:13px;color:var(--muted)}

/* SECTIONS */
section{padding:78px 0}
.section-head{text-align:center;max-width:680px;margin:0 auto 48px}
.kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.section-title{font-family:"Space Grotesk",sans-serif;font-size:clamp(28px,4vw,42px);line-height:1.15;margin:10px 0 14px}
.section-lead{color:var(--muted);font-size:16px}

/* SERVICOS */
.grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;transition:.3s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-5px);border-color:rgba(168,85,247,.5)}
.icon-box{width:48px;height:48px;border-radius:14px;background:rgba(124,58,237,.18);border:1px solid rgba(168,85,247,.3);display:grid;place-items:center;font-size:22px;margin-bottom:18px}
.card h3{font-family:"Space Grotesk",sans-serif;font-size:21px;margin:0 0 10px}
.card p{color:var(--muted);font-size:14px;margin:0 0 16px}
.card ul{margin:0;padding-left:18px;color:#CBD5E1;font-size:13px;line-height:1.9}

/* PORTFOLIO */
.portfolio{background:rgba(255,255,255,.015);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cases-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.case-card{background:var(--card-2);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;transition:.3s}
.case-card:hover{border-color:var(--accent);transform:translateY(-4px)}
.case-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.case-card h3{font-family:"Space Grotesk",sans-serif;font-size:22px;margin:0 0 10px}
.case-card p{color:var(--muted);font-size:14px;margin:0}

/* CONSULTOR IA */
.ai-section{background:radial-gradient(circle at 20% 50%,rgba(124,58,237,.22),transparent 50%)}
.ai-wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:42px;align-items:center}
.ai-benefits{display:grid;gap:12px;margin-top:22px}
.ai-benefit{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:#E2E8F0}
.chat-box{background:#0F0F1E;border:1px solid rgba(168,85,247,.45);border-radius:24px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.6)}
.chat-head{background:linear-gradient(135deg,#1E1B4B,#311042);padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.chat-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-weight:700;font-size:18px}
.chat-head strong{display:block;font-size:15px}
.chat-head span{font-size:12px;color:#34D399}
.chat-body{height:350px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:#0B0B16}
.msg{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.55;max-width:86%;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--card-2);border:1px solid var(--line);color:#F1F5F9;align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-chips{padding:10px 14px 6px;display:flex;gap:7px;flex-wrap:wrap;background:#0B0B16;border-top:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--card);color:#E2E8F0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--accent);color:#fff}
.chat-form{display:flex;gap:8px;padding:12px 14px;background:#0F0F1E;border-top:1px solid var(--line)}
.chat-form input{flex:1;background:#16162B;border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:#fff;font-size:14px;outline:none}
.chat-form input:focus{border-color:var(--accent)}
.chat-form button{border:0;border-radius:999px;padding:0 20px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:700;font-size:14px;cursor:pointer}

/* CTA FINAL */
.cta-box{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(6,182,212,.15));border:1px solid rgba(168,85,247,.35);border-radius:28px;padding:48px 28px;text-align:center}
.cta-box h2{font-family:"Space Grotesk",sans-serif;font-size:clamp(26px,4vw,38px);margin:0 0 12px}
.cta-box p{color:#CBD5E1;max-width:600px;margin:0 auto 26px}

footer{border-top:1px solid var(--line);padding:34px 0 92px;color:var(--muted);font-size:13px}
.footer-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

/* BOTAO FLUTUANTE UNICO */
.floating-cta{position:fixed;right:18px;bottom:18px;z-index:40;border:1px solid rgba(6,182,212,.55);border-radius:999px;padding:13px 20px;background:linear-gradient(135deg,#1E1B4B,#6D28D9);color:#fff;font-weight:700;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:inline-flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 8px #34D399}

@media(max-width:820px){
  .menu{display:block}
  .navlinks{display:none;position:absolute;top:76px;left:0;right:0;background:#0F0F1E;padding:20px 5%;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:16px}
  .navlinks.open{display:flex}
  .grid-4,.cases-grid,.ai-wrap,.metrics{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header data-track="cabecalho">
  <div class="container nav">
    <a class="brand" href="#inicio">
      <div class="brand-badge">V</div>
      <div>VEZQORA<small>TECNOLOGIA & IA</small></div>
    </a>
    <button class="menu" id="menuBtn" aria-label="Abrir menu">☰</button>
