<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEZQORA — AI Engineering & Systems</title>
  <style>
    :root {
      --bg-dark: #090714;
      --card-bg: #120f24;
      --panel-bg: #17132e;
      --border-glow: rgba(139, 92, 246, 0.35);
      --text-main: #f5f3ff;
      --text-muted: #a59ec9;
      --green: #10b981;
      --grad-brand: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 55%, #ec4899 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b1238 0%, var(--bg-dark) 65%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 88px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(9, 7, 20, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-v {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--grad-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      animation: pulseV 2.4s infinite ease-in-out;
      box-shadow: 0 0 22px rgba(139, 92, 246, 0.45);
    }

    @keyframes pulseV {
      0%, 100% { transform: scale(1); box-shadow: 0 0 18px rgba(139, 92, 246, 0.4); }
      50% { transform: scale(1.06); box-shadow: 0 0 30px rgba(236, 72, 153, 0.65); }
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: 0.06em;
      font-size: 16px;
    }

    .brand-sub {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .btn-top {
      background: var(--grad-brand);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .container {
      max-width: 540px;
      margin: 22px auto 0;
      padding: 0 14px;
    }

    .assistant-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }

    .voice-controls {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .voice-label {
      display: block;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .voice-select {
      width: 100%;
      background: #0d0a1c;
      color: #fff;
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      margin-bottom: 12px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-mic {
      background: var(--green);
      color: #04130d;
      border: none;
      border-radius: 12px;
      padding: 11px 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-mic.listening {
      background: #f59e0b;
      color: #170e02;
    }

    .btn-sound {
      background: #231d42;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 11px 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-sound.muted {
      opacity: 0.7;
      background: #1b1730;
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 430px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 14px;
    }

    .msg {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .msg-bot {
      align-self: flex-start;
      background: #1d1836;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .msg-user {
      align-self: flex-end;
      background: var(--grad-brand);
      color: #fff;
      font-weight: 500;
    }

    .btn-listen {
      margin-top: 9px;
      background: #120e24;
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-listen:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      background: #1d1836;
      color: #e2dcff;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: #0d0a1c;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }

    .btn-send {
      background: var(--grad-brand);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-send:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status-note {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      min-height: 16px;
    }

    .wa-float {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 30;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 999px;
      box-shadow: 0 10px 28px rgba(22, 163, 74, 0.45);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo-v">V</div>
      <div>
        <div class="brand-title">VEZQORA</div>
        <div class="brand-sub">AI ENGINEERING &amp; SYSTEMS</div>
      </div>
    </div>
    <button class="btn-top" type="button" onclick="focarInput()">Falar com IA</button>
  </header>

  <main class="container">
    <section class="assistant-card" id="assistente-vezqora">
      <div class="voice-controls">
        <label class="voice-label" for="voz-gemini-select">Voz do Gemini:</label>
        <select class="voice-select" id="voz-gemini-select">
          <option value="Charon" selected>Charon (Masculina Grave)</option>
          <option value="Aoede">Aoede (Feminina Natural)</option>
          <option value="Kore">Kore (Feminina Clara)</option>
          <option value="Puck">Puck (Masculina Dinâmica)</option>
          <option value="Fenrir">Fenrir (Masculina Marcante)</option>
          <option value="Leda">Leda (Feminina Suave)</option>
        </select>

        <div class="action-row">
          <button class="btn-mic" id="btn-mic" type="button" onclick="alternarMicrofone()">
            🎙️ Ativar Voz e Falar
          </button>
          <button class="btn-sound" id="btn-som" type="button" onclick="alternarSom()">
            🔊 Som: Ativo
          </button>
        </div>
      </div>

      <div class="chat-box" id="chat-box"></div>

      <div class="chips">
        <button class="chip" type="button" onclick="enviarRapido('Site + IA')">Site + IA</button>
        <button class="chip" type="button" onclick="enviarRapido('Aplicativo')">Aplicativo</button>
        <button class="chip" type="button" onclick="enviarRapido('Agente de IA')">Agente de IA</button>
        <button class="chip" type="button" onclick="enviarRapido('Sistema')">Sistema</button>
      </div>

      <form class="input-row" id="chat-form" onsubmit="enviarFormulario(event)">
        <input
          class="chat-input"
          id="chat-input"
          type="text"
          placeholder="Responda aqui ou use o microfone..."
          autocomplete="off"
        />
        <button class="btn-send" id="btn-send" type="submit">Enviar</button>
      </form>

      <div class="status-note" id="status-note"></div>
    </section>
  </main>

  <a
    class="wa-float"
    href="https://wa.me/5551991895177?text=Ol%C3%A1%20Leandro%2C%20vim%20pelo%20site%20da%20VEZQORA%20e%20quero%20um%20or%C3%A7amento."
    target="_blank"
    rel="noopener noreferrer"
  >
    💬 WhatsApp VEZQORA
  </a>

  <script>
    // Substitua pela URL exata do seu Cloudflare Worker vezqora-ia
    const WORKER_URL = "https://vezqora-ia.SEU-SUBDOMINIO.workers.dev";

    let somAtivo = true;
    let enviandoTexto = false;
    let audioAtual = null;
    let audioUrlAtual = null;
    let recognition = null;
    let ouvindo = false;
    const historico = [];

    const chatBox = document.getElementById("chat-box");
    const chatInput = document.getElementById("chat-input");
    const btnSend = document.getElementById("btn-send");
    const statusNote = document.getElementById("status-note");
    const voiceSelect = document.getElementById("voz-gemini-select");
    const btnSom = document.getElementById("btn-som");
    const btnMic = document.getElementById("btn-mic");

    function getVozSelecionada() {
      return String(voiceSelect.value || "Charon").split(/[\s(]/)[0].trim() || "Charon";
    }

    function focarInput() {
      chatInput.scrollIntoView({ behavior: "smooth", block: "center" });
      chatInput.focus();
    }

    function alternarSom() {
      somAtivo = !somAtivo;
      btnSom.textContent = somAtivo ? "🔊 Som: Ativo" : "🔇 Som: Mudo";
      btnSom.classList.toggle("muted", !somAtivo);
      if (!somAtivo) {
        pararAudioAtual();
      }
    }

    function pararAudioAtual() {
      if (audioAtual) {
        audioAtual.pause();
        audioAtual.currentTime = 0;
        audioAtual = null;
      }
      if (audioUrlAtual) {
        URL.revokeObjectURL(audioUrlAtual);
        audioUrlAtual = null;
      }
    }

    function pcm16Base64ToWavBlob(base64Pcm, sampleRate = 24000, numChannels = 1) {
      const binaryString = atob(base64Pcm);
      const pcmLength = binaryString.length;
      const buffer = new ArrayBuffer(44 + pcmLength);
      const view = new DataView(buffer);

      const writeAscii = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeAscii(0, "RIFF");
      view.setUint32(4, 36 + pcmLength, true);
      writeAscii(8, "WAVE");
      writeAscii(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numChannels * 2, true);
      view.setUint16(32, numChannels * 2, true);
      view.setUint16(34, 16, true);
      writeAscii(36, "data");
      view.setUint32(40, pcmLength, true);

      for (let i = 0; i < pcmLength; i++) {
        view.setUint8(44 + i, binaryString.charCodeAt(i));
      }

      return new Blob([buffer], { type: "audio/wav" });
    }

    async function tocarAudioBase64(audioBase64, audioMimeType = "audio/L16;rate=24000") {
      if (!audioBase64) return false;
      pararAudioAtual();

      const rateMatch = /rate=(\d+)/.exec(audioMimeType || "");
      const sampleRate = rateMatch ? Number(rateMatch[1]) : 24000;
      const wavBlob = pcm16Base64ToWavBlob(audioBase64, sampleRate, 1);

      audioUrlAtual = URL.createObjectURL(wavBlob);
      audioAtual = new Audio(audioUrlAtual);
      audioAtual.onended = () => {
        if (audioUrlAtual) {
          URL.revokeObjectURL(audioUrlAtual);
          audioUrlAtual = null;
        }
      };

      await audioAtual.play();
      return true;
    }

    async function ouvirComVozGemini(texto, botaoEl = null) {
      const textoLimpo = String(texto || "").trim();
      if (!textoLimpo) return;

      const voiceName = getVozSelecionada();
      const textoOriginalBtn = botaoEl ? botaoEl.textContent : "";

      try {
        if (botaoEl) {
          botaoEl.disabled = true;
          botaoEl.textContent = `⏳ Gerando ${voiceName}...`;
        }
        statusNote.textContent = `Gerando áudio nativo do Gemini (${voiceName})...`;

        const res = await fetch(`${WORKER_URL}/api/tts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: "tts",
            text: textoLimpo,
            voiceName
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.audioBase64) {
          throw new Error(data.details || data.error || "Falha no áudio do Gemini");
        }

        await tocarAudioBase64(data.audioBase64, data.audioMimeType);
        statusNote.textContent = `Reproduzindo voz nativa Gemini: ${voiceName}`;
      } catch (err) {
        console.error(err);
        statusNote.textContent = `Áudio indisponível no momento (${err.message}). O chat de texto segue normal.`;
      } finally {
        if (botaoEl) {
          botaoEl.disabled = false;
          botaoEl.textContent = textoOriginalBtn || "🔊 Ouvir com voz Gemini";
        }
      }
    }

    function adicionarMensagem(role, texto, botaoElRef = null) {
      const div = document.createElement("div");
      div.className = `msg ${role === "user" ? "msg-user" : "msg-bot"}`;

      const textoNode = document.createElement("div");
      textoNode.textContent = texto;
      div.appendChild(textoNode);

      if (role === "assistant") {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn-listen";
        btn.textContent = "🔊 Ouvir com voz Gemini";
        btn.onclick = () => ouvirComVozGemini(texto, btn);
        div.appendChild(btn);
        if (botaoElRef) botaoElRef.current = btn;
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function enviarRapido(texto) {
      enviarMensagem(texto);
    }

    function enviarFormulario(event) {
      event.preventDefault();
      const texto = chatInput.value.trim();
      if (!texto) return;
      chatInput.value = "";
      enviarMensagem(texto);
    }

    async function enviarMensagem(texto) {
      const msgLimpa = String(texto || "").trim();
      if (!msgLimpa || enviandoTexto) return;

      enviandoTexto = true;
      btnSend.disabled = true;

      adicionarMensagem("user", msgLimpa);
      historico.push({ role: "user", content: msgLimpa });
      statusNote.textContent = "Consultora VEZQORA digitando...";

      const btnBotRef = { current: null };

      try {
        const voiceName = getVozSelecionada();
        const res = await fetch(`${WORKER_URL}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msgLimpa,
            history: historico.slice(-10),
            voiceName,
            includeAudio: false
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.details || data.error || `HTTP ${res.status}`);
        }

        const reply = data.reply || "Entendido! Pode me contar mais detalhes do seu projeto?";
        historico.push({ role: "assistant", content: reply });

        adicionarMensagem("assistant", reply, btnBotRef);

        statusNote.textContent = data.lead
          ? "Briefing enviado para o WhatsApp e planilha da VEZQORA!"
          : "";

        // Áudio roda em segundo plano sem bloquear ou travar o envio de texto
        if (somAtivo && reply) {
          ouvirComVozGemini(reply, btnBotRef.current).catch(() => {});
        }
      } catch (err) {
        console.error(err);
        statusNote.textContent = `Erro ao enviar texto: ${err.message}`;
        adicionarMensagem(
          "assistant",
          "Não consegui responder agora. Confira se a URL do Worker está correta e tente novamente."
        );
      } finally {
        enviandoTexto = false;
        btnSend.disabled = false;
        chatInput.focus();
      }
    }

    function alternarMicrofone() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusNote.textContent = "Seu navegador não suporta reconhecimento de voz. Digite sua resposta abaixo.";
        return;
      }

      if (ouvindo && recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        ouvindo = true;
        btnMic.textContent = "⏹️ Parar Microfone";
        btnMic.classList.add("listening");
        statusNote.textContent = "Ouvindo você falar...";
      };

      recognition.onresult = (event) => {
        const transcricao = event.results?.[0]?.[0]?.transcript || "";
        if (transcricao.trim()) {
          enviarMensagem(transcricao.trim());
        }
      };

      recognition.onerror = (event) => {
        statusNote.textContent = `Microfone: ${event.error || "não foi possível capturar voz"}`;
      };

      recognition.onend = () => {
        ouvindo = false;
        btnMic.textContent = "🎙️ Ativar Voz e Falar";
        btnMic.classList.remove("listening");
      };

      recognition.start();
    }

    const mensagemInicial =
      "Olá! Sou a consultora especialista da VEZQORA. Qual solução você busca hoje: Site Profissional, Aplicativo Interativo, Agente de IA ou Sistema Personalizado?";
    historico.push({ role: "assistant", content: mensagemInicial });
    adicionarMensagem("assistant", mensagemInicial);
  </script>
</body>
</html>
